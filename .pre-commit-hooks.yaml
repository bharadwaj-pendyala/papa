- id: papa
  name: papa readability
  description: Grade Markdown and text files and fail above the max grade in papa.toml.
  entry: papa
  args: [--report, concise, --allow-empty]
  language: python
  types_or: [markdown, mdx, plain-text]
  exclude: (?i)(^|/)((requirements|constraints)[\w.-]*\.txt|robots\.txt|cmakelists\.txt|(licen[cs]e(-\w+)?|copying|notices?|third[_-]party[_-](notices?|licen[cs]es?))(\.\w+)?|LICENSES/.*)$
  require_serial: true
  verbose: true
